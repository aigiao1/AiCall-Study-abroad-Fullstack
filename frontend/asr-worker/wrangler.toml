name = "asr-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# 阿里云 ASR 服务地址
ALIYUN_ASR_URL = "https://nls-gateway-cn-shanghai.aliyuncs.com/stream/v1/asr"

# 注意：敏感信息请使用 secrets 而非 vars
# 通过以下命令设置：
# wrangler secret put ALIYUN_APPKEY
# wrangler secret put ALIYUN_TOKEN

# R2 存储桶绑定（用于保存音频文件）
# 需要先创建 bucket: wrangler r2 bucket create audio-bucket
# [[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "audio-bucket"
