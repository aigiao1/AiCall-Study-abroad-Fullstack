<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI智能客服 - 语音通话</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(180deg, #f0f4ff 0%, #e8edff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
    }
    .start-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f0f4ff 0%, #e8edff 100%);
      z-index: 100;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .start-screen.hidden { opacity: 0; visibility: hidden; }
    .start-screen h1 { font-size: 28px; margin-bottom: 40px; color: #333; font-weight: 600; }
    .start-btn {
      width: 140px; height: 140px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #5b7fff 0%, #6b8cff 100%);
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(91, 127, 255, 0.4);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .start-btn:hover { transform: scale(1.05); box-shadow: 0 12px 40px rgba(91, 127, 255, 0.5); }
    .start-btn svg { width: 40px; height: 40px; }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 430px;
      width: 100%;
      margin: 0 auto;
      height: 100vh;
      background: linear-gradient(180deg, #f0f4ff 0%, #e8edff 100%);
      position: relative;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .message-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .message.ai .message-avatar { background: #fff; }
    .message-content {
      background: #fff;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      position: relative;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .message.ai .message-content { 
      border-bottom-left-radius: 4px;
      background: #fff;
    }
    .message.user .message-content {
      background: linear-gradient(135deg, #7b8cff 0%, #6b7bff 100%);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message-time { font-size: 11px; color: #999; margin-top: 6px; text-align: right; }
    .message.user .message-time { color: rgba(255,255,255,0.7); }
    .message.speaking .message-content::after {
      content: '';
      display: inline-block;
      width: 4px; height: 4px;
      background: #5b7fff;
      border-radius: 50%;
      margin-left: 8px;
      animation: speakingDot 1s infinite;
      box-shadow: 8px 0 0 #5b7fff, 16px 0 0 #5b7fff;
    }
    /* 底部挂断按钮 */
    .bottom-bar {
      padding: 20px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .end-call-btn {
      width: 100%;
      max-width: 320px;
      height: 56px;
      border-radius: 28px;
      border: none;
      background: linear-gradient(135deg, #ff5a5a 0%, #ff6b6b 100%);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255, 90, 90, 0.35);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 500;
    }
    .end-call-btn:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(255, 90, 90, 0.45); }
    .end-call-btn svg { width: 20px; height: 20px; }
    .call-timer {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      font-family: 'SF Mono', monospace;
    }
    .status-text { 
      font-size: 13px; 
      color: #666; 
      display: flex; 
      align-items: center; 
      gap: 6px;
      margin-bottom: 8px;
    }
    .status-dot {
      width: 6px; height: 6px;
      background: #5b7fff;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .end-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #f0f4ff 0%, #e8edff 100%);
      z-index: 100;
      padding: 40px;
    }
    .end-screen.show { display: flex; }
    .end-screen h2 { font-size: 24px; margin-bottom: 20px; color: #333; }
    .call-summary {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .summary-item:last-child { border-bottom: none; }
    .summary-label { color: #666; }
    .summary-value { font-weight: 600; color: #333; }
    .restart-btn {
      padding: 14px 40px;
      border-radius: 28px;
      border: none;
      background: linear-gradient(135deg, #5b7fff 0%, #6b8cff 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(91, 127, 255, 0.35);
    }
    .restart-btn:hover { transform: scale(1.05); }
    .config-panel {
      position: fixed;
      top: 40px; right: 16px;
      z-index: 50;
    }
    .config-toggle {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.8);
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .config-content {
      position: absolute;
      top: 44px; right: 0;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      width: 260px;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .config-content.show { display: block; }
    .config-item { margin-bottom: 12px; }
    .config-item label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; }
    .config-item input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #f8f9fa;
      color: #333;
      font-size: 13px;
    }
    .config-item input:focus { outline: none; border-color: #5b7fff; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes speakingDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="config-panel">
    <button class="config-toggle" id="config-toggle" title="配置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div class="config-content" id="config-content">
      <div class="config-item">
        <label for="worker-url">Worker URL</label>
        <input type="text" id="worker-url" value="https://asr-proxy.pb8xj6rk8v.workers.dev" placeholder="Worker URL">
      </div>
    </div>
  </div>

  <div class="start-screen" id="start-screen">
    <h1>AI 智能客服</h1>
    <button class="start-btn" id="start-btn">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
      <span>开始通话</span>
    </button>
  </div>

  <div class="chat-container" id="chat-container" style="display: none;">
    <div class="messages" id="messages"></div>
    
    <!-- 底部状态栏和挂断按钮 -->
    <div class="bottom-bar">
      <div class="status-text" id="status-text">
        <span class="status-dot"></span>
        <span>准备就绪</span>
      </div>
      <button class="end-call-btn" id="end-call-btn" title="结束通话">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
        <span class="call-timer" id="call-timer">00:31</span>
      </button>
    </div>
  </div>

  <div class="end-screen" id="end-screen">
    <h2>通话已结束</h2>
    <div class="call-summary">
      <div class="summary-item">
        <span class="summary-label">通话时长</span>
        <span class="summary-value" id="summary-duration">00:00:00</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">对话轮数</span>
        <span class="summary-value" id="summary-rounds">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">服务评分</span>
        <span class="summary-value" style="color: #ffb800;">⭐⭐⭐⭐⭐</span>
      </div>
    </div>
    <button class="restart-btn" id="restart-btn">重新开始</button>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/xiangyuecn/Recorder@latest/recorder.wav.min.js"></script>
  <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
  <script>
    const CONFIG = {
      workerUrl: 'https://asr-proxy.pb8xj6rk8v.workers.dev',
      vad: { silenceThreshold: 20, silenceDuration: 1800, minRecordDuration: 800, maxRecordDuration: 30000 },
      greetings: [
        '您好！我是您的智能客服助手，很高兴为您服务。请问有什么可以帮您的吗？',
        '您好！欢迎来到智能客服中心，我是您的专属助手。请问今天有什么可以帮您的？',
        '您好！我是AI客服小助手，请问有什么我可以协助您的？',
        '您好！很高兴接到您的来电，我是智能客服助手，请问有什么可以为您服务的？'
      ]
    };

    const MockServer = {
      conversationRounds: 0,
      async chat(messages) {
        await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 1000));
        this.conversationRounds++;
        const responses = [
          { content: '好的，我已经记录了您的问题。请问还有其他需要补充的信息吗？', shouldEnd: false },
          { content: '明白了，根据您提供的信息，我建议您可以尝试以下方案：首先检查网络连接是否正常，然后重新启动相关服务。', shouldEnd: false },
          { content: '非常感谢您的耐心等待。我已经为您完成了相关操作，稍后您会收到确认短信。祝您生活愉快，再见！', shouldEnd: true }
        ];
        const response = responses[Math.min(this.conversationRounds - 1, responses.length - 1)];
        return { role: 'assistant', content: response.content, shouldEnd: response.shouldEnd };
      },
      reset() { this.conversationRounds = 0; }
    };

    class VoiceRecognizerWithVAD {
      constructor(options = {}) {
        this.recorder = null;
        this.isRecording = false;
        this.vadConfig = { ...CONFIG.vad, ...options.vad };
        this.recorderConfig = { type: 'wav', sampleRate: 16000, bitRate: 16, ...options.recorder };
        this.lastVoiceTime = 0;
        this.recordStartTime = 0;
        this.onAutoStop = null;
        this.onVoiceStart = options.onVoiceStart || null;
        this.silenceStartTime = null;
      }

      async init() {
        this.recorder = new Recorder({
          type: this.recorderConfig.type,
          sampleRate: this.recorderConfig.sampleRate,
          bitRate: this.recorderConfig.bitRate,
          onProcess: (buffers, powerLevel, duration) => this.handleVAD(powerLevel, duration)
        });
        return new Promise((resolve, reject) => {
          this.recorder.open(() => resolve(), (msg, isNotAllow) => {
            const error = new Error(isNotAllow ? '用户拒绝录音权限' : msg);
            error.isPermissionDenied = isNotAllow;
            reject(error);
          });
        });
      }

      handleVAD(powerLevel, duration) {
        if (!this.isRecording) return;
        const now = Date.now();
        const isVoice = powerLevel > this.vadConfig.silenceThreshold;
        
        // 需要连续检测到声音才认为是有效语音
        if (isVoice) {
          this.voiceFrameCount = (this.voiceFrameCount || 0) + 1;
          if (this.voiceFrameCount >= 3) { // 连续3帧检测到声音
            this.lastVoiceTime = now;
            this.silenceStartTime = null;
            if (this.onVoiceStart && !this.hasVoiceStarted) {
              this.hasVoiceStarted = true;
              this.onVoiceStart();
            }
          }
        } else {
          this.voiceFrameCount = 0;
          if (!this.silenceStartTime) {
            this.silenceStartTime = now;
          }
        }
        
        const silenceTime = now - this.lastVoiceTime;
        const recordDuration = now - this.recordStartTime;
        
        // 只有真正录到语音后才检测静音
        if (this.hasVoiceStarted && 
            recordDuration > this.vadConfig.minRecordDuration && 
            silenceTime > this.vadConfig.silenceDuration) {
          this.stopWithCallback('silence');
        } else if (recordDuration >= this.vadConfig.maxRecordDuration) {
          this.stopWithCallback('maxDuration');
        } else if (!this.hasVoiceStarted && recordDuration > 8000) {
          // 8秒内没检测到语音，重新开始监听
          this.stopWithCallback('noVoice');
        }
      }

      start(onAutoStop) {
        if (!this.recorder) throw new Error('录音器未初始化');
        this.onAutoStop = onAutoStop;
        this.recordStartTime = Date.now();
        this.lastVoiceTime = Date.now();
        this.silenceStartTime = null;
        this.hasVoiceStarted = false;
        this.voiceFrameCount = 0;
        this.recorder.start();
        this.isRecording = true;
      }

      stopWithCallback(reason) {
        if (!this.isRecording) return;
        this.stop().then(result => { if (this.onAutoStop) this.onAutoStop({ ...result, reason }); })
          .catch(error => console.error('[VAD] 停止录音失败:', error));
      }

      stop() {
        return new Promise((resolve, reject) => {
          if (!this.recorder) { reject(new Error('录音器未初始化')); return; }
          this.isRecording = false;
          this.recorder.stop((blob, duration) => resolve({ blob, duration }), msg => reject(new Error(msg)));
        });
      }

      close() {
        if (this.recorder) { this.recorder.close(); this.recorder = null; this.isRecording = false; }
      }

      static isSupported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
    }

    async function recognizeSpeech(audioBlob, workerUrl) {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'recording.wav');
      formData.append('format', 'wav');
      formData.append('sampleRate', '16000');
      const response = await fetch(`${workerUrl}/api/asr/recognize`, { method: 'POST', body: formData });
      if (!response.ok) throw new Error(`HTTP 请求失败: ${response.status}`);
      const result = await response.json();
      if (result.status === 20000000) return result.result || '';
      throw new Error(result.message || '识别失败');
    }

    async function playTTS(text, workerUrl, onStart, onEnd) {
      if (!text || !text.trim()) return;
      if (text.length > 300) text = text.substring(0, 300);
      const ttsUrl = new URL(`${workerUrl}/api/tts/synthesize`);
      ttsUrl.searchParams.set('text', text);
      ttsUrl.searchParams.set('format', 'mp3');
      ttsUrl.searchParams.set('sample_rate', '16000');
      try {
        if (onStart) onStart();
        const response = await fetch(ttsUrl.toString());
        const contentType = response.headers.get('Content-Type');
        if (contentType === 'audio/mpeg') {
          const audioBlob = await response.blob();
          const audioUrl = URL.createObjectURL(audioBlob);
          const audio = new Audio(audioUrl);
          audio.play();
          return new Promise((resolve) => {
            audio.onended = () => { URL.revokeObjectURL(audioUrl); if (onEnd) onEnd(); resolve(); };
            audio.onerror = () => { URL.revokeObjectURL(audioUrl); if (onEnd) onEnd(); resolve(); };
          });
        } else {
          const error = await response.json();
          console.error('[TTS] 合成失败:', error.message);
          if (onEnd) onEnd();
        }
      } catch (error) {
        console.error('[TTS] 请求失败:', error);
        if (onEnd) onEnd();
      }
    }

    const App = {
      state: 'READY',
      messages: [],
      recognizer: null,
      callStartTime: null,
      callTimerInterval: null,
      workerUrl: CONFIG.workerUrl,

      elements: {
        startScreen: document.getElementById('start-screen'),
        chatContainer: document.getElementById('chat-container'),
        messages: document.getElementById('messages'),
        statusText: document.getElementById('status-text'),
        callTimer: document.getElementById('call-timer'),
        endCallBtn: document.getElementById('end-call-btn'),
        endScreen: document.getElementById('end-screen'),
        workerUrlInput: document.getElementById('worker-url')
      },

      init() { 
        this.bindEvents(); 
        this.loadConfig(); 
      },

      bindEvents() {
        document.getElementById('start-btn').addEventListener('click', () => this.startCall());
        document.getElementById('end-call-btn').addEventListener('click', () => this.endCall());
        document.getElementById('restart-btn').addEventListener('click', () => this.restart());
        document.getElementById('config-toggle').addEventListener('click', () => {
          document.getElementById('config-content').classList.toggle('show');
        });
        this.elements.workerUrlInput.addEventListener('change', (e) => {
          this.workerUrl = e.target.value || CONFIG.workerUrl;
        });
      },

      loadConfig() {
        const savedUrl = localStorage.getItem('workerUrl');
        if (savedUrl) { this.workerUrl = savedUrl; this.elements.workerUrlInput.value = savedUrl; }
      },

      async initRecognizer() {
        if (this.recognizer) {
          this.recognizer.close();
        }
        this.recognizer = new VoiceRecognizerWithVAD({
          vad: CONFIG.vad,
          onVoiceStart: () => this.setState('LISTENING')
        });
        await this.recognizer.init();
      },

      async startCall() {
        try {
          if (!VoiceRecognizerWithVAD.isSupported()) { alert('您的浏览器不支持语音识别功能'); return; }
          this.recognizer = new VoiceRecognizerWithVAD({
            vad: CONFIG.vad,
            onVoiceStart: () => this.setState('LISTENING')
          });
          await this.recognizer.init();
          this.elements.startScreen.classList.add('hidden');
          this.elements.chatContainer.style.display = 'flex';
          this.elements.endCallBtn.style.display = 'flex';
          this.startCallTimer();
          MockServer.reset();
          this.messages = [];
          this.elements.messages.innerHTML = '';
          await this.playGreeting();
        } catch (error) {
          console.error('启动通话失败:', error);
          alert('启动失败: ' + error.message);
        }
      },

      async playGreeting() {
        this.setState('GREETING');
        const greeting = CONFIG.greetings[Math.floor(Math.random() * CONFIG.greetings.length)];
        this.addMessage('ai', greeting);
        
        // 关闭录音器避免回声干扰
        if (this.recognizer) {
          this.recognizer.close();
          this.recognizer = null;
        }
        
        await playTTS(greeting, this.workerUrl, () => this.setState('SPEAKING'), async () => {
          if (this.state !== 'ENDED') {
            // TTS结束后重新初始化录音器
            await this.initRecognizer();
            this.startListening();
          }
        });
      },

      startListening() {
        if (this.state === 'ENDED') return;
        this.setState('IDLE');
        this.recognizer.start(async (result) => await this.handleVoiceResult(result));
      },

      async handleVoiceResult({ blob, duration, reason }) {
        if (this.state === 'ENDED') return;
        // 没有检测到有效语音，直接重新开始监听
        if (reason === 'noVoice') {
          console.log('[App] 未检测到语音，继续监听');
          this.startListening();
          return;
        }
        if (!blob || blob.size === 0 || duration < 1000) { this.startListening(); return; }
        this.setState('RECOGNIZING');
        try {
          const text = await recognizeSpeech(blob, this.workerUrl);
          if (!text || !text.trim()) { this.startListening(); return; }
          this.addMessage('user', text);
          await this.sendToServer();
        } catch (error) {
          console.error('识别失败:', error);
          this.addMessage('ai', '抱歉，我没有听清楚，请您再说一遍。');
          
          if (this.recognizer) {
            this.recognizer.close();
            this.recognizer = null;
          }
          
          await playTTS('抱歉，我没有听清楚，请您再说一遍。', this.workerUrl, null, async () => {
            if (this.state !== 'ENDED') {
              await this.initRecognizer();
              this.startListening();
            }
          });
        }
      },

      async sendToServer() {
        this.setState('WAITING');
        try {
          const response = await MockServer.chat(this.messages);
          this.addMessage('ai', response.content);
          
          // 关闭录音器避免回声干扰
          if (this.recognizer) {
            this.recognizer.close();
            this.recognizer = null;
          }
          
          await playTTS(response.content, this.workerUrl, () => this.setState('SPEAKING'), async () => {
            if (response.shouldEnd) {
              this.endCall(true);
            } else if (this.state !== 'ENDED') {
              // TTS结束后重新初始化录音器
              await this.initRecognizer();
              this.startListening();
            }
          });
        } catch (error) {
          console.error('服务端请求失败:', error);
          this.addMessage('ai', '抱歉，服务暂时不可用，请稍后再试。');
          
          if (this.recognizer) {
            this.recognizer.close();
            this.recognizer = null;
          }
          
          await playTTS('抱歉，服务暂时不可用，请稍后再试。', this.workerUrl, null, async () => {
            if (this.state !== 'ENDED') {
              await this.initRecognizer();
              this.startListening();
            }
          });
        }
      },

      addMessage(role, content) {
        const message = { id: Date.now().toString(), role, content, timestamp: Date.now() };
        this.messages.push(message);
        this.renderMessage(message);
        this.scrollToBottom();
      },

      renderMessage(message) {
        const div = document.createElement('div');
        div.className = `message ${message.role}`;
        div.id = `msg-${message.id}`;
        const time = new Date(message.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        const avatarHtml = message.role === 'ai' 
          ? '<img src="https://api.dicebear.com/7.x/bottts/svg?seed=ai-assistant&backgroundColor=b6e3f4" alt="AI">' 
          : '👤';
        div.innerHTML = `
          <div class="message-avatar">${avatarHtml}</div>
          <div>
            <div class="message-content">${this.escapeHtml(message.content)}</div>
            <div class="message-time">${time}</div>
          </div>`;
        this.elements.messages.appendChild(div);
      },

      escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; },
      scrollToBottom() { this.elements.messages.scrollTop = this.elements.messages.scrollHeight; },
      setState(newState) { this.state = newState; this.updateUI(); },

      updateUI() {
        const statusMap = { 
          'READY': '准备就绪', 
          'GREETING': 'AI正在说话...', 
          'IDLE': '正在听...', 
          'LISTENING': '听到您的声音了', 
          'RECOGNIZING': '识别中...', 
          'WAITING': '思考中...', 
          'SPEAKING': 'AI正在说话...', 
          'ENDED': '通话结束' 
        };
        const statusText = this.elements.statusText;
        if (statusText) {
          const dot = statusText.querySelector('.status-dot');
          const text = statusText.querySelector('span:last-child') || statusText;
          if (text !== statusText) {
            text.textContent = statusMap[this.state] || this.state;
          } else {
            statusText.innerHTML = `<span class="status-dot"></span><span>${statusMap[this.state] || this.state}</span>`;
          }
        }
        const lastAiMsg = this.elements.messages.querySelector('.message.ai:last-child');
        if (lastAiMsg) lastAiMsg.classList.toggle('speaking', this.state === 'SPEAKING');
      },

      startCallTimer() {
        this.callStartTime = Date.now();
        this.elements.callTimer.textContent = '00:00';
        this.callTimerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - this.callStartTime) / 1000);
          const minutes = Math.floor(elapsed / 60);
          const seconds = elapsed % 60;
          this.elements.callTimer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);
      },

      stopCallTimer() { if (this.callTimerInterval) { clearInterval(this.callTimerInterval); this.callTimerInterval = null; } },

      endCall(autoEnd = false) {
        if (this.state === 'ENDED') return;
        this.setState('ENDED');
        this.stopCallTimer();
        if (this.recognizer) { this.recognizer.close(); this.recognizer = null; }
        const timerText = this.elements.callTimer.textContent;
        const parts = timerText.split(':');
        let durationText = timerText;
        if (parts.length === 2) {
          durationText = `00:${timerText}`;
        }
        document.getElementById('summary-duration').textContent = durationText;
        document.getElementById('summary-rounds').textContent = this.messages.filter(m => m.role === 'user').length;
        setTimeout(() => this.elements.endScreen.classList.add('show'), autoEnd ? 2000 : 0);
      },

      restart() {
        this.elements.endScreen.classList.remove('show');
        this.elements.chatContainer.style.display = 'none';
        this.elements.endCallBtn.style.display = 'none';
        this.elements.startScreen.classList.remove('hidden');
        this.elements.messages.innerHTML = '';
        this.setState('READY');
      }
    };

    // 初始化 vConsole
    const vConsole = new VConsole({
      theme: 'light',
      onReady: function() {
        console.log('vConsole 已加载');
      }
    });

    // 添加自定义插件：快速操作
    vConsole.addPlugin({
      id: 'quick_actions',
      name: '快捷操作',
      render: function(onClick) {
        const html = `
          <div style="padding: 10px;">
            <button onclick="window.simulateAI()" style="margin: 5px; padding: 8px 16px; background: #5b7fff; color: white; border: none; border-radius: 4px;">模拟AI回复</button>
            <button onclick="window.simulateUser()" style="margin: 5px; padding: 8px 16px; background: #00b894; color: white; border: none; border-radius: 4px;">模拟用户输入</button>
            <button onclick="window.forceEndCall()" style="margin: 5px; padding: 8px 16px; background: #ff5a5a; color: white; border: none; border-radius: 4px;">强制结束通话</button>
            <button onclick="window.checkState()" style="margin: 5px; padding: 8px 16px; background: #666; color: white; border: none; border-radius: 4px;">检查状态</button>
          </div>
        `;
        return html;
      }
    });

    // 全局调试函数
    window.simulateAI = function() {
      const testMessages = [
        '这是模拟的AI回复消息，用于测试UI显示效果。',
        '收到您的消息，我正在处理中，请稍候...',
        '调试模式：模拟长文本消息。这里是一些额外的文本内容，用于测试消息气泡的换行和高度自适应效果。'
      ];
      const msg = testMessages[Math.floor(Math.random() * testMessages.length)];
      App.addMessage('ai', msg);
      console.log('[Debug] 模拟AI消息:', msg);
    };

    window.simulateUser = function() {
      const testInputs = [
        '测试用户输入',
        '你好，我想咨询一个问题',
        '这个功能的原理是什么？'
      ];
      const msg = testInputs[Math.floor(Math.random() * testInputs.length)];
      App.addMessage('user', msg);
      console.log('[Debug] 模拟用户消息:', msg);
    };

    window.forceEndCall = function() {
      console.log('[Debug] 强制结束通话');
      App.endCall();
    };

    window.checkState = function() {
      console.log('[Debug] 当前状态:', {
        state: App.state,
        messages: App.messages.length,
        recording: App.recognizer?.isRecording || false,
        callStartTime: App.callStartTime,
        workerUrl: App.workerUrl
      });
    };

    // 劫持 App 方法以添加调试日志
    const originalSetState = App.setState;
    App.setState = function(newState) {
      const oldState = this.state;
      originalSetState.call(this, newState);
      console.log(`[State] ${oldState} -> ${newState}`);
    };

    const originalAddMessage = App.addMessage;
    App.addMessage = function(role, content) {
      originalAddMessage.call(this, role, content);
      console.log(`[Message] 新增${role === 'ai' ? 'AI' : '用户'}消息:`, content.substring(0, 50));
    };

    document.addEventListener('DOMContentLoaded', () => {
      App.init();
      console.log('App 已初始化');
    });
  </script>
</body>
</html>
